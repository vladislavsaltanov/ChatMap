<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Карта слов Telegram-чата. Работа строго локально, без отправки данных в сеть." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ChatMap — карта слов Telegram-чата</title>
  </head>
  <body>
    <main>
      <section id="landing" aria-label="Загрузка"></section>
      <section id="progress" aria-label="Обработка" hidden></section>
      <section id="map" aria-label="Карта" hidden></section>
    </main>
    <div id="portrait-block" aria-label="Только широкие экраны">
      <p>Только широкие экраны</p>
      <p class="label">Поверни устройство или открой с компьютера</p>
    </div>
    <dialog id="error" aria-labelledby="error-text">
      <p id="error-text"></p>
      <form method="dialog"><button type="submit" aria-label="Закрыть сообщение об ошибке">Закрыть</button></form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
